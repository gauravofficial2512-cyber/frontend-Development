<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <form action="./server" method="post">
            <h1>Login</h1>
            <label for="name" name="username" class="input">Username</label>
            <br>
            <input id="name" type="text" placeholder="Gaurav">
            <br>
            <br>
            <label for="pswd" name="pswd" class="input">Password</label>
            <br>
            <input id="pswd" type="password" placeholder="********" class="pswd">
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
